base {
  archivesName.set("dreamvoice-api")
}

dependencies {
  compileOnlyApi("org.jetbrains:annotations:${project.annotations_version}")
  compileOnlyApi("de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}")
  compileOnlyApi("com.fasterxml.jackson.core:jackson-databind:${project.jackson_version}")
}

java {
  withSourcesJar()
  withJavadocJar()
}

javadoc {
  options.encoding = 'UTF-8'
  options.charSet = 'UTF-8'
  options.windowTitle = "DreamVoice API ${project.version}"
  options.docTitle = "DreamVoice API Documentation (${project.version})"
  options.addStringOption('Xdoclint:none', '-quiet')
  if (JavaVersion.current().isJava9Compatible()) {
    options.addBooleanOption('html5', true)
  }
}

publishing {
  repositories {
    maven {
      name = "GitHubPackages"
      url = uri("https://maven.pkg.github.com/Dreamin-MC/DreamVoice")
      credentials {
        username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
        password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.token") ?: ""
      }
    }
  }
  publications {
    gpr(MavenPublication) {
      from components.java
      groupId = "fr.dreamin"
      artifactId = "dreamvoice-api"
      version = project.version

      pom {
        name = "DreamVoice API"
        description = "Public API for DreamVoice spatial audio & acoustic framework"
        url = "https://github.com/Dreamin-MC/DreamVoice"
      }
    }
  }
}