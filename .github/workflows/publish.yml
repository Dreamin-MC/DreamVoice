name: Publish Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, Publish & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract versions and validate changelog
        id: extract_version
        run: |
          TAG="${{ github.ref_name }}"
          # Remove leading 'v' if present (e.g., v1.0.7 -> 1.0.7, 1.0.7 -> 1.0.7)
          CLEAN_VERSION="${TAG#v}"
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          
          # Extract minecraft_version, voicechat_api_version and java_version directly from gradle.properties
          MC_VER=$(sed -nE 's/^minecraft_version\s*=\s*(.+)/\1/p' gradle.properties | tr -d '\r')
          VC_VER=$(sed -nE 's/^voicechat_api_version\s*=\s*(.+)/\1/p' gradle.properties | tr -d '\r')
          JAVA_VER=$(sed -nE 's/^java_version\s*=\s*(.+)/\1/p' gradle.properties | tr -d '\r')
          JAVA_VER=${JAVA_VER:-25}
          
          echo "MC_VERSION=${MC_VER}" >> $GITHUB_ENV
          echo "VOICECHAT_VERSION=${VC_VER}" >> $GITHUB_ENV
          echo "JAVA_VERSION=${JAVA_VER}" >> $GITHUB_ENV
          
          echo "Detected Tag Version : ${CLEAN_VERSION}"
          echo "Extracted Minecraft MC : ${MC_VER}"
          echo "Extracted VoiceChat VC : ${VC_VER}"
          echo "Extracted Java Version : ${JAVA_VER}"

          # Strict Changelog Validation
          if [ -f "changelog/${CLEAN_VERSION}.md" ]; then
            CHANGELOG="changelog/${CLEAN_VERSION}.md"
          elif [ -f "changelog/${TAG}.md" ]; then
            CHANGELOG="changelog/${TAG}.md"
          else
            echo "::error::❌ Release aborted: No changelog found for version '${CLEAN_VERSION}'!"
            echo "::error::Expected file: changelog/${CLEAN_VERSION}.md"
            echo "::error::Please create the changelog file before pushing the tag."
            exit 1
          fi

          echo "Found valid changelog: ${CHANGELOG}"
          echo "CHANGELOG_FILE=${CHANGELOG}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish API to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew :api:build :api:publish -Pversion="${{ env.VERSION }}" --no-daemon

      - name: Build Paper Plugin ShadowJar
        run: |
          ./gradlew :paper:shadowJar -Pversion="${{ env.VERSION }}" --no-daemon

      - name: Build Fabric Mod Jar
        run: |
          ./gradlew :fabric:build -Pversion="${{ env.VERSION }}" --no-daemon

      - name: Publish Paper to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'dreamvoice' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: paper/build/libs/DreamVoice.jar
          name: DreamVoice Paper ${{ env.VERSION }}
          version: ${{ env.VERSION }}+paper
          version-type: release
          changelog-file: ${{ env.CHANGELOG_FILE }}
          loaders: |
            paper
            purpur
            spigot
          game-versions: |
            ${{ env.MC_VERSION }}
          dependencies: |
            simple-voice-chat@bukkit-${{ env.VOICECHAT_VERSION }}(required)

      - name: Publish Fabric to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'dreamvoice' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: fabric/build/libs/DreamVoice-fabric-${{ env.VERSION }}.jar
          name: DreamVoice Fabric ${{ env.VERSION }}
          version: ${{ env.VERSION }}+fabric
          version-type: release
          changelog-file: ${{ env.CHANGELOG_FILE }}
          loaders: |
            fabric
          game-versions: |
            ${{ env.MC_VERSION }}
          dependencies: |
            fabric-api(required)
            simple-voice-chat(required)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: DreamVoice ${{ env.VERSION }}
          body_path: ${{ env.CHANGELOG_FILE }}
          draft: false
          prerelease: false
          files: |
            paper/build/libs/DreamVoice.jar
            fabric/build/libs/DreamVoice-fabric-${{ env.VERSION }}.jar
            api/build/libs/dreamvoice-api-${{ env.VERSION }}.jar
            api/build/libs/dreamvoice-api-${{ env.VERSION }}-sources.jar
            api/build/libs/dreamvoice-api-${{ env.VERSION }}-javadoc.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Modrinth Project Description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'dreamvoice' }}
        run: |
          if [ -n "${MODRINTH_TOKEN}" ]; then
            echo "Fetching current project description from Modrinth API..."
            CURRENT_BODY=$(curl -s -H "Authorization: ${MODRINTH_TOKEN}" "https://api.modrinth.com/v2/project/${PROJECT_ID}" | jq -r '.body // empty')
            
            if [ -n "$CURRENT_BODY" ]; then
              # Replace the dependency versions and badges in the Modrinth body
              UPDATED_BODY=$(printf '%s\n' "$CURRENT_BODY" \
                | sed -E "s/(compileOnly ['\"]fr\.dreamin:dreamvoice-api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/" \
                | sed -E "s/(compileOnly ['\"]com\.github\.Dreamin-MC\.DreamVoice:api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/" \
                | sed -E "s/(<version>)[^<]+(<\/version>)/\1${{ env.VERSION }}\2/" \
                | sed -E "s/(Modrinth-)[0-9]+\.[0-9]+\.[0-9]+/\1${{ env.VERSION }}/")
              
              # Send PATCH to update Modrinth project body
              PAYLOAD=$(jq -n --arg b "$UPDATED_BODY" '{body: $b}')
              RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "https://api.modrinth.com/v2/project/${PROJECT_ID}" \
                -H "Authorization: ${MODRINTH_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              
              echo "Modrinth project description update status: ${RESPONSE_CODE}"
            else
              echo "Could not fetch current Modrinth project body (or project not found yet)."
            fi
          fi

      - name: Update version files and push to main
        run: |
          git fetch origin main
          git checkout main
          
          # 1. Replace versions in README.md
          sed -i -E "s/(compileOnly ['\"]fr\.dreamin:dreamvoice-api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/" README.md
          sed -i -E "s/(compileOnly ['\"]com\.github\.Dreamin-MC\.DreamVoice:api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/" README.md
          sed -i -E "s/(<version>)[^<]+(<\/version>)/\1${{ env.VERSION }}\2/" README.md
          sed -i -E "s/(Modrinth-)[0-9]+\.[0-9]+\.[0-9]+/\1${{ env.VERSION }}/" README.md
          
          # 2. Update gradle.properties
          sed -i -E "s/^(version\s*=\s*).*/\1${{ env.VERSION }}/" gradle.properties
          
          # 3. Update build.gradle default fallback version
          sed -i -E "s/(\? rootProject\.findProperty\(\"version\"\) : \")[^\"]+(\")/\1${{ env.VERSION }}\2/" build.gradle

          if ! git diff --quiet README.md gradle.properties build.gradle; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md gradle.properties build.gradle
            git commit -m "chore(release): bump version to ${{ env.VERSION }} [skip ci]"
            git push origin main
          else
            echo "No version changes in README.md, gradle.properties, or build.gradle to commit."
          fi

      - name: Update versions in GitHub Wiki
        env:
          WIKI_AUTH_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GH_PAT || secrets.GH_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${WIKI_AUTH_TOKEN}" ]; then
            echo "::warning::No authentication token provided for wiki synchronization. Skipping."
            exit 0
          fi

          echo "Cloning GitHub Wiki..."
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf "x-access-token:%s" "${WIKI_AUTH_TOKEN}" | base64 | tr -d '\n')"
          if git clone "https://github.com/${{ github.repository }}.wiki.git" wiki; then
            cd wiki
            
            # 1. Update Home.md (Minecraft, Simple Voice Chat, Java, and Plugin versions)
            if [ -f "Home.md" ]; then
              sed -i -E "s/(Paper \/ Purpur( \/ Fabric)? )[0-9]+(\.[0-9]+)*\+/\1${{ env.MC_VERSION }}+/" Home.md
              sed -i -E "s/(Simple Voice Chat \(SVC\) )[0-9]+(\.[0-9]+)*\+/\1${{ env.VOICECHAT_VERSION }}+/" Home.md
              sed -i -E "s/(\(version )[0-9]+(\.[0-9]+)* (or higher\))/\1${{ env.MC_VERSION }} \3/" Home.md
              sed -i -E "s/(Java )[0-9]+ (or higher)/\1${{ env.JAVA_VERSION }} \2/" Home.md
              sed -i -E "s/(\(v)[0-9]+(\.[0-9]+)*\+\)/\1${{ env.VOICECHAT_VERSION }}+\)/" Home.md
              sed -i -E "s/(\[DreamVoice\] Enabling DreamVoice v)[0-9]+\.[0-9]+\.[0-9]+/\1${{ env.VERSION }}/" Home.md
            fi
            
            # 2. Update Developer-API.md (Dependency versions for JitPack and GitHub Packages)
            if [ -f "Developer-API.md" ]; then
              sed -i -E "s/(compileOnly\(?['\"]com\.github\.Dreamin-MC\.DreamVoice:api:)[^'\")]+(['\")]*)/\1${{ env.VERSION }}\2/" Developer-API.md
              sed -i -E "s/(compileOnly [\"']com\.github\.Dreamin-MC\.DreamVoice:api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/" Developer-API.md
              sed -i -E "s/(compileOnly\(?['\"]fr\.dreamin:dreamvoice-api:)[^'\")]+(['\")]*)/\1${{ env.VERSION }}\2/" Developer-API.md
              sed -i -E "s/(<version>)[^<]+(<\/version>)/\1${{ env.VERSION }}\2/" Developer-API.md
            fi
            
            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "chore(release): bump version in wiki to ${{ env.VERSION }} [skip ci]"
              git push origin master || git push origin main
              echo "Successfully pushed version updates to GitHub Wiki."
            else
              echo "No version changes detected in GitHub Wiki."
            fi
            cd ..
          else
            echo "::warning::Could not clone GitHub Wiki repository."
          fi

      - name: Rollback / Delete remote tag on failure
        if: failure() || cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Workflow failed or was cancelled. Deleting remote tag '${{ env.TAG }}' to prevent inconsistent release state..."
          curl -s -X DELETE \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${{ env.TAG }}" || true
          echo "Remote tag '${{ env.TAG }}' deleted from GitHub."

