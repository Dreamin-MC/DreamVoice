name: Publish Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, Publish & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract versions and validate changelog
        id: extract_version
        run: |
          TAG="${{ github.ref_name }}"
          # Remove leading 'v' if present (e.g., v1.0.7 -> 1.0.7, 1.0.7 -> 1.0.7)
          CLEAN_VERSION="${TAG#v}"
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          
          # Extract mcVersion and voiceChatVersion directly from build.gradle
          MC_VER=$(sed -nE 's/.*def mcVersion\s*=\s*"([^"]+)".*/\1/p' build.gradle)
          VC_VER=$(sed -nE 's/.*def voiceChatVersion\s*=\s*"([^"]+)".*/\1/p' build.gradle)
          
          echo "MC_VERSION=${MC_VER}" >> $GITHUB_ENV
          echo "VOICECHAT_VERSION=${VC_VER}" >> $GITHUB_ENV
          
          echo "Detected Tag Version : ${CLEAN_VERSION}"
          echo "Extracted Minecraft MC : ${MC_VER}"
          echo "Extracted VoiceChat VC : ${VC_VER}"

          # Strict Changelog Validation
          if [ -f "changelog/${CLEAN_VERSION}.md" ]; then
            CHANGELOG="changelog/${CLEAN_VERSION}.md"
          elif [ -f "changelog/${TAG}.md" ]; then
            CHANGELOG="changelog/${TAG}.md"
          else
            echo "::error::❌ Release aborted: No changelog found for version '${CLEAN_VERSION}'!"
            echo "::error::Expected file: changelog/${CLEAN_VERSION}.md"
            echo "::error::Please create the changelog file before pushing the tag."
            exit 1
          fi

          echo "Found valid changelog: ${CHANGELOG}"
          echo "CHANGELOG_FILE=${CHANGELOG}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish API to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew :api:publish -Pversion="${{ env.VERSION }}" --no-daemon

      - name: Build Plugin ShadowJar
        run: |
          ./gradlew :core:shadowJar -Pversion="${{ env.VERSION }}" --no-daemon

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'dreamvoice' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: core/build/libs/DreamVoice.jar
          name: DreamVoice ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog-file: ${{ env.CHANGELOG_FILE }}
          loaders: |
            spigot
            paper
            purpur
          game-versions: |
            ${{ env.MC_VERSION }}
          dependencies: |
            simple-voice-chat@bukkit-${{ env.VOICECHAT_VERSION }}(required)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: DreamVoice ${{ env.VERSION }}
          body_path: ${{ env.CHANGELOG_FILE }}
          draft: false
          prerelease: false
          files: |
            core/build/libs/DreamVoice.jar
            api/build/libs/dreamvoice-api-${{ env.VERSION }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Modrinth Project Description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'dreamvoice' }}
        run: |
          if [ -n "${MODRINTH_TOKEN}" ]; then
            echo "Fetching current project description from Modrinth API..."
            CURRENT_BODY=$(curl -s -H "Authorization: ${MODRINTH_TOKEN}" "https://api.modrinth.com/v2/project/${PROJECT_ID}" | jq -r '.body // empty')
            
            if [ -n "$CURRENT_BODY" ]; then
              # Replace the dependency version in the Modrinth body
              UPDATED_BODY=$(printf '%s\n' "$CURRENT_BODY" | sed -E "s/(compileOnly ['\"]fr\.dreamin:dreamvoice-api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/")
              
              # Send PATCH to update Modrinth project body
              PAYLOAD=$(jq -n --arg b "$UPDATED_BODY" '{body: $b}')
              RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "https://api.modrinth.com/v2/project/${PROJECT_ID}" \
                -H "Authorization: ${MODRINTH_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              
              echo "Modrinth project description update status: ${RESPONSE_CODE}"
            else
              echo "Could not fetch current Modrinth project body (or project not found yet)."
            fi
          fi

      - name: Update README.md and push to main
        run: |
          git fetch origin main
          git checkout main
          
          # Replace version in the README.md dependency block
          sed -i -E "s/(compileOnly ['\"]fr\.dreamin:dreamvoice-api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/" README.md
          
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(docs): update README dependency version to ${{ env.VERSION }} [skip ci]"
            git push origin main
          else
            echo "No changes in README.md to commit."
          fi

      - name: Send Discord Release Notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION: ${{ env.VERSION }}
          TAG: ${{ env.TAG }}
          CHANGELOG_FILE: ${{ env.CHANGELOG_FILE }}
          MC_VERSION: ${{ env.MC_VERSION }}
          VOICECHAT_VERSION: ${{ env.VOICECHAT_VERSION }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No Discord webhook secret found (DISCORD_WEBHOOK / DISCORD_WEBHOOK_URL). Skipping notification."
            exit 0
          fi

          python3 - << 'EOF'
          import os
          import json
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK")
          version = os.environ.get("VERSION", "1.0.0")
          tag = os.environ.get("TAG", "1.0.0")
          changelog_file = os.environ.get("CHANGELOG_FILE", "")
          mc_ver = os.environ.get("MC_VERSION", "1.21.4")
          vc_ver = os.environ.get("VOICECHAT_VERSION", "2.6.x")
          repo = os.environ.get("REPO", "Dreamin-MC/DreamVoice")
          server_url = os.environ.get("SERVER_URL", "https://github.com")

          release_url = f"{server_url}/{repo}/releases/tag/{tag}"
          modrinth_url = "https://modrinth.com/plugin/dreamvoice"
          javadoc_url = "https://dreamin-mc.github.io/DreamVoice/"

          changelog_text = ""
          if changelog_file and os.path.isfile(changelog_file):
              with open(changelog_file, "r", encoding="utf-8") as f:
                  changelog_text = f.read().strip()

          if len(changelog_text) > 3800:
              changelog_text = changelog_text[:3800] + f"\n\n*... [Read full changelog on GitHub]({release_url})*"

          payload = {
              "content": f"🚀 **DreamVoice `{version}` has just been released!**",
              "embeds": [
                  {
                      "title": f"🎙️ DreamVoice v{version}",
                      "url": release_url,
                      "color": 0x00AF5C,
                      "description": changelog_text or "No changelog provided.",
                      "fields": [
                          {"name": "🎮 Minecraft", "value": f"`{mc_ver}`", "inline": True},
                          {"name": "🔊 VoiceChat", "value": f"`{vc_ver}`", "inline": True},
                          {"name": "☕ Java", "value": "`25`", "inline": True}
                      ],
                      "footer": {
                          "text": "Dreamin' Studios • DreamVoice"
                      }
                  }
              ],
              "components": [
                  {
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "GitHub Release",
                              "url": release_url,
                              "emoji": {"name": "🐙"}
                          },
                          {
                              "type": 2,
                              "style": 5,
                              "label": "Modrinth",
                              "url": modrinth_url,
                              "emoji": {"name": "📦"}
                          },
                          {
                              "type": 2,
                              "style": 5,
                              "label": "JavaDoc API",
                              "url": javadoc_url,
                              "emoji": {"name": "📖"}
                          }
                      ]
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DreamVoice-Release-Bot"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord Webhook notification sent successfully! HTTP {resp.status}")
          except Exception as e:
              print(f"Failed to send Discord Webhook notification: {e}")
          EOF

      - name: Rollback / Delete remote tag on failure
        if: failure() || cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Workflow failed or was cancelled. Deleting remote tag '${{ env.TAG }}' to prevent inconsistent release state..."
          curl -s -X DELETE \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${{ env.TAG }}" || true
          echo "Remote tag '${{ env.TAG }}' deleted from GitHub."

