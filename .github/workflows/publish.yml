name: Publish Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, Publish & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract versions from tag and build.gradle
        id: extract_version
        run: |
          TAG="${{ github.ref_name }}"
          # Remove leading 'v' if present (e.g., v1.0.3 -> 1.0.3, 1.0.3 -> 1.0.3)
          CLEAN_VERSION="${TAG#v}"
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          
          # Extract mcVersion and voiceChatVersion directly from build.gradle
          MC_VER=$(sed -nE 's/.*def mcVersion\s*=\s*"([^"]+)".*/\1/p' build.gradle)
          VC_VER=$(sed -nE 's/.*def voiceChatVersion\s*=\s*"([^"]+)".*/\1/p' build.gradle)
          
          echo "MC_VERSION=${MC_VER}" >> $GITHUB_ENV
          echo "VOICECHAT_VERSION=${VC_VER}" >> $GITHUB_ENV
          
          echo "Detected Tag Version : ${CLEAN_VERSION}"
          echo "Extracted Minecraft MC : ${MC_VER}"
          echo "Extracted VoiceChat VC : ${VC_VER}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish API to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew :api:publish -Pversion="${{ env.VERSION }}" --no-daemon

      - name: Build Plugin ShadowJar
        run: |
          ./gradlew :core:shadowJar -Pversion="${{ env.VERSION }}" --no-daemon

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'dreamvoice' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: core/build/libs/DreamVoice.jar
          name: DreamVoice ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          loaders: |
            spigot
            paper
            purpur
          game-versions: |
            ${{ env.MC_VERSION }}
          dependencies: |
            simple-voice-chat@bukkit-${{ env.VOICECHAT_VERSION }}(required)

      - name: Update Modrinth Project Description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'dreamvoice' }}
        run: |
          if [ -n "${MODRINTH_TOKEN}" ]; then
            echo "Fetching current project description from Modrinth API..."
            CURRENT_BODY=$(curl -s -H "Authorization: ${MODRINTH_TOKEN}" "https://api.modrinth.com/v2/project/${PROJECT_ID}" | jq -r '.body // empty')
            
            if [ -n "$CURRENT_BODY" ]; then
              # Replace the dependency version in the Modrinth body
              UPDATED_BODY=$(printf '%s\n' "$CURRENT_BODY" | sed -E "s/(compileOnly ['\"]fr\.dreamin:dreamvoice-api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/")
              
              # Send PATCH to update Modrinth project body
              PAYLOAD=$(jq -n --arg b "$UPDATED_BODY" '{body: $b}')
              RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "https://api.modrinth.com/v2/project/${PROJECT_ID}" \
                -H "Authorization: ${MODRINTH_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              
              echo "Modrinth project description update status: ${RESPONSE_CODE}"
            else
              echo "Could not fetch current Modrinth project body (or project not found yet)."
            fi
          fi

      - name: Update README.md and push to main
        run: |
          git fetch origin main
          git checkout main
          
          # Replace version in the README.md dependency block
          sed -i -E "s/(compileOnly ['\"]fr\.dreamin:dreamvoice-api:)[^'\"]+(['\"])/\1${{ env.VERSION }}\2/" README.md
          
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(docs): update README dependency version to ${{ env.VERSION }} [skip ci]"
            git push origin main
          else
            echo "No changes in README.md to commit."
          fi
