plugins {
  id 'java'
  id 'maven-publish'
  id 'com.gradleup.shadow'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

subprojects {
  apply plugin: "java"
  apply plugin: "maven-publish"
  if (project.name != "fabric" && project.name != "neoforge") {
    apply plugin: "com.gradleup.shadow"
    apply plugin: "java-library"
  }

  group = "fr.dreamin"
  version = rootProject.findProperty("version") && rootProject.findProperty("version") != "unspecified" ? rootProject.findProperty("version") : "2.0.3"
  description = "DreamVoice"

  repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven {
      url = 'https://maven.maxhenkel.de/repository/public'
      content { includeGroupAndSubgroups("de.maxhenkel") }
    }
    maven {
      url = "https://api.modrinth.com/maven"
      content { includeGroup("maven.modrinth") }
    }
    maven { url = "https://maven.neoforged.net/releases" }
    maven {
      url = "https://jitpack.io"
      content { includeGroupAndSubgroups("com.github") }
    }
  }

  dependencies {
    compileOnly("org.jetbrains:annotations:${project.annotations_version}")
    compileOnly("org.projectlombok:lombok:${project.lombok_version}")
    annotationProcessor("org.projectlombok:lombok:${project.lombok_version}")
  }

  def targetJavaVersion = JavaVersion.VERSION_25
  java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
    if (JavaVersion.current() < targetJavaVersion) {
      toolchain.languageVersion.set(JavaLanguageVersion.of(targetJavaVersion.majorVersion))
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
  }

  test {
    useJUnitPlatform()
  }

}
