plugins {
  id 'java'
  id 'maven-publish'
  id 'com.gradleup.shadow'
  id 'net.fabricmc.fabric-loom' apply false
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(project.property("java_version") as int)
  }
}

subprojects {
  apply plugin: "java"
  apply plugin: "maven-publish"
  if (project.name != "fabric") {
    apply plugin: "com.gradleup.shadow"
    apply plugin: "java-library"
  }

  group = "fr.dreamin"
  version = rootProject.findProperty("version") && rootProject.findProperty("version") != "unspecified" ? rootProject.findProperty("version") : "2.0.1"
  description = "DreamVoice"

  repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://repo.codemc.org/repository/maven-public/" }
    maven { url = "https://oss.sonatype.org/content/groups/public/" }
    maven { url = "https://mvn.lumine.io/repository/maven-public/" }
    maven { url = 'https://repo.extendedclip.com/releases/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://api.modrinth.com/maven" }
  }

  dependencies {
    compileOnly("org.jetbrains:annotations:${project.annotations_version}")
    compileOnly("org.projectlombok:lombok:${project.lombok_version}")
    annotationProcessor("org.projectlombok:lombok:${project.lombok_version}")
  }

  def targetJavaVersion = JavaVersion.toVersion(project.property("java_version") as int)
  java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
    if (JavaVersion.current() < targetJavaVersion) {
      toolchain.languageVersion.set(JavaLanguageVersion.of(targetJavaVersion.majorVersion))
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
  }

  test {
    useJUnitPlatform()
  }

}
