pluginManagement {
  plugins {
    id 'com.gradleup.shadow' version "${shadow_version}"
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'xyz.jpenilla.run-paper' version "${run_paper_version}"
  }
  repositories {
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    maven {
      name = 'NeoForged'
      url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

rootProject.name = 'DreamVoice'
include("api", "common", "paper", "fabric", "neoforge")